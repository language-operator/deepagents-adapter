name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Sync dev dependencies
        run: uv sync --frozen --group dev

      - name: Run pytest
        run: uv run pytest -q

  image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: deepagents-adapter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The suite ships inside the coding-runtime base, so the checks always
      # match the base this image was built on.
      - name: Run coding-runtime conformance suite
        run: |
          docker run --rm --entrypoint cat deepagents-adapter:test \
            /opt/coding-runtime/test/conformance.sh > conformance.sh
          chmod +x conformance.sh
          ./conformance.sh deepagents-adapter:test adapter

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Lint chart
        run: helm lint chart

      - name: Template chart
        run: helm template deepagents chart
